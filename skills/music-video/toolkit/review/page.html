<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review</title>
<style>
:root { --bg:#0e0d12; --panel:#1a1820; --line:#322f3d; --fg:#f3f0f7; --dim:#a7a1b5; --accent:#f3c64b; --up:#57d39a; --fix:#ffc53d; --down:#ff5f7a; color-scheme: dark; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width:1400px; margin:0 auto; padding:32px 16px 72px; display:grid; gap:36px; }
h1 { font:800 clamp(28px,5vw,48px)/1.05 system-ui, sans-serif; color:var(--accent); margin:0 0 10px; }
header p { color:var(--dim); margin:0; max-width:75ch; }
section { display:grid; gap:12px; }
h2 { font:700 22px system-ui, sans-serif; margin:0; }
section > p { color:var(--dim); margin:0; max-width:80ch; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr)); gap:16px; }
.grid.one { grid-template-columns:1fr; }
.card { display:grid; gap:8px; align-content:start; min-width:0; }
.frame { border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel); }
.frame video, .frame img { width:100%; display:block; aspect-ratio:16/9; object-fit:contain; background:#000; }
.frame img { cursor:zoom-in; }
.card.up .frame { box-shadow:0 0 0 2px var(--up); } .card.fix .frame { box-shadow:0 0 0 2px var(--fix); } .card.down .frame { opacity:.5; }
.row { display:flex; gap:8px; align-items:center; }
.row button { flex:1; font:inherit; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 0; cursor:pointer; }
.row button[aria-pressed=true].up { background:var(--up); color:var(--bg); } .row button[aria-pressed=true].fix { background:var(--fix); color:var(--bg); } .row button[aria-pressed=true].down { background:var(--down); color:var(--bg); }
textarea { font:inherit; width:100%; box-sizing:border-box; min-height:52px; resize:vertical; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; }
.card h3 { margin:0; font:600 17px/1.3 system-ui, sans-serif; } .card dl { margin:0; display:grid; gap:6px; } .card dt { color:var(--accent); font-size:11px; letter-spacing:.08em; text-transform:uppercase; } .card dd { margin:0; } .more { color:var(--accent); font-size:13px; }
.tag { color:var(--dim); font-size:13px; letter-spacing:.06em; text-transform:uppercase; } .status { color:var(--dim); font-size:12px; min-height:1em; }
#box { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:9; cursor:zoom-out; }
#box.on { display:flex; } #box img { max-width:96vw; max-height:92vh; } #box span { position:fixed; left:0; right:0; bottom:10px; text-align:center; color:var(--dim); font-size:13px; }
</style></head><body><main id="main"></main><div id="box"><img alt=""><span></span></div>
<script>
// One review page for any manifest: /review/<name> reads /review/<name>.json and /api/feedback/<name>.
// Votes and notes save themselves; there is no Save button.
const NAME = "__NAME__";
const main = document.getElementById("main"), box = document.getElementById("box");
const stills = [];   // every image on the page, for the lightbox: click to enlarge, arrows to step, Esc to close
let at = -1;
const show = i => { at = (i + stills.length) % stills.length; box.querySelector("img").src = stills[at].src; box.querySelector("span").textContent = stills[at].label; box.classList.add("on"); };
box.onclick = () => box.classList.remove("on");
addEventListener("keydown", e => { if (!box.classList.contains("on")) return;
  if (e.key === "Escape") box.classList.remove("on"); else if (e.key === "ArrowRight") show(at + 1); else if (e.key === "ArrowLeft") show(at - 1); });

(async () => {
  const m = await (await fetch(`/review/${NAME}.json`)).json();
  const fb = await (await fetch(`/api/feedback/${NAME}`)).json();
  document.title = m.title || NAME;
  main.innerHTML = `<header><h1></h1><p></p></header>`;
  main.querySelector("h1").textContent = m.title || NAME; main.querySelector("header p").textContent = m.intro || "";
  for (const s of m.sections) {
    const sec = document.createElement("section");
    sec.innerHTML = `<h2></h2><p></p><div class="grid ${s.items.length === 1 && s.wide ? "one" : ""}"></div>`;
    sec.querySelector("h2").textContent = s.name; sec.querySelector("p").textContent = s.what || "";
    for (const it of s.items) {
      const c = document.createElement("article"); c.className = "card";
      c.innerHTML = `<div class="frame"></div><span class="tag"></span><div class="row"><button class="up" aria-pressed="false">👍 Pick</button><button class="fix" aria-pressed="false" title="Keep the idea, but something in it needs fixing; say what in the note">⚠️ Fix</button><button class="down" aria-pressed="false">👎 Nix</button></div><textarea placeholder="Note (saves as you type)"></textarea><span class="status"></span>`;
      const el = document.createElement(it.kind === "video" ? "video" : "img"); el.src = "/" + it.src;
      if (it.kind === "video") { el.controls = true; el.playsInline = true; el.preload = "metadata"; }
      else { el.loading = "lazy"; el.alt = ""; const i = stills.push({ src: el.src, label: it.label || it.id }) - 1; el.onclick = () => show(i); }
      c.querySelector(".frame").append(el);
      c.querySelector(".tag").textContent = it.label || it.id;
      if (it.title || it.details || it.url) { const info = document.createElement("div"); info.style.display = "grid"; info.style.gap = "8px";
        if (it.title) { const h = document.createElement("h3"); h.textContent = it.title; info.append(h); }
        const dl = document.createElement("dl");
        for (const d of it.details || []) { const dt = document.createElement("dt"); dt.textContent = d.name; const dd = document.createElement("dd"); dd.textContent = d.text; dl.append(dt, dd); }
        info.append(dl);
        if (/^https?:\/\//.test(it.url || "")) { const a = document.createElement("a"); a.className = "more"; a.href = it.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Open the source ↗"; info.append(a); }
        c.querySelector(".tag").after(info); }
      const st = { vote: fb[it.id]?.vote ?? null };
      const ta = c.querySelector("textarea"); ta.value = fb[it.id]?.note ?? "";
      const paint = () => { for (const v of ["up", "fix", "down"]) { c.querySelector("." + v).setAttribute("aria-pressed", st.vote === v); c.classList.toggle(v, st.vote === v); } };
      const save = async () => { const s2 = c.querySelector(".status"); s2.textContent = "Saving…";   // every write carries the vote and the note box's current text
        try { const r = await fetch(`/api/feedback/${NAME}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: it.id, vote: st.vote, note: ta.value.trim() }) }); s2.textContent = r.ok ? "Saved" : "Couldn't save"; } catch { s2.textContent = "Couldn't save (is the server running?)"; } };
      for (const v of ["up", "fix", "down"]) c.querySelector("." + v).onclick = () => { st.vote = st.vote === v ? null : v; paint(); save(); if (v === "fix" && st.vote === "fix" && !ta.value.trim()) ta.focus(); };
      let t; ta.oninput = () => { clearTimeout(t); t = setTimeout(save, 700); }; ta.onblur = () => { clearTimeout(t); save(); };
      paint(); sec.querySelector(".grid").append(c);
    }
    main.append(sec);
  }
})().catch(e => { main.textContent = `Could not load review "${NAME}": ${e.message}. Is <project>/review/${NAME}.json there?`; });
</script></body></html>
